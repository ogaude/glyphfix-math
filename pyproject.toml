[project]
name = "glyphfix-math"
version = "0.1.0"
description = "Evaluation harness, dataset tooling and resource guard for fine-tuning LightOnOCR on mathematical notation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rapidfuzz>=3.14,<4",
    "pypdfium2>=5.14,<6",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "pillow>=12.3,<13",
]

[dependency-groups]
dev = [
    "pyarrow>=26.0,<27",
    "pytest>=9.1,<10",
    "ruff>=0.6",
]
release = [
    "datasets==5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphfix_math"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: needs Docker and the texlive/texlive:latest image",
]

[tool.ruff]
line-length = 140
target-version = "py312"
